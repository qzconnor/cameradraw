appId: com.cameradraw.app
productName: CameraDraw
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{service,scripts,e2e,out-e2e,test-results,playwright-report}/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.e2e.json,playwright.config.ts}'
asarUnpack:
  - resources/**
# `cameradraw.exe --mcp` (MCP over stdio) must start as CameraDraw even when the client's
# environment carries ELECTRON_RUN_AS_NODE, e.g. from an editor terminal. Nothing runs it as Node.
electronFuses:
  runAsNode: false
win:
  executableName: cameradraw
  # Background service for camera photo buttons (`npm run build:service`), see service/.
  extraResources:
    - from: service/publish/cameradraw-buttons.exe
      to: button-service/cameradraw-buttons.exe
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Installer with pages, so the installation folder can be chosen. Updates skip the pages and
  # install into the folder of the previous installation (see build/installer.nsh).
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: CameraDraw benötigt Zugriff auf die Kamera.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Connor Breuer
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Where electron-updater looks for new versions (the releases created by semantic-release).
publish:
  provider: github
  owner: qzconnor
  repo: cameradraw
