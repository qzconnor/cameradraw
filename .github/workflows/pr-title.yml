# Pull requests are squash-merged with their title as commit message, and semantic-release reads
# the version bump from it – so the title must be a Conventional Commit (feat: …, fix: …).
name: PR-Titel

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional-Commit-Titel
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            refactor
            docs
            style
            test
            build
            ci
            chore
          requireScope: false
          subjectPattern: '^\S.*$'
          subjectPatternError: 'Der Titel braucht nach dem Typ eine Beschreibung, z. B. "feat: Galerie durchsuchen".'
